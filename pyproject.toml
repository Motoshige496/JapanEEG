[project]
name = "japaneeg"
version = "1.0.0"
description = "Download, loading and technical-validation code of the JapanEEG dataset"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "mne>=1.7",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
japaneeg-download = "japaneeg.download:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/japaneeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
